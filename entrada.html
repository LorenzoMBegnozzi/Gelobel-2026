<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo Gelobel</title>
  <link rel="icon" type="image/png" href="./src/img-gelobel/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c8922a;
      --gold-light: #f0b429;
      --dark: #0d0d0d;
      --cream: #f5f0e8;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

    /* ── NAV ── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 48px;
      pointer-events: none;
    }

    .nav-side {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.55);
      transition: color 0.3s;
      text-decoration: none;
    }
    .nav-side::before {
      content: '';
      display: block;
      width: 28px;
      height: 1px;
      background: currentColor;
      flex-shrink: 0;
      transition: width 0.3s;
    }
    .nav-side.right::before { display: none; }
    .nav-side.right::after {
      content: '';
      display: block;
      width: 28px;
      height: 1px;
      background: currentColor;
      flex-shrink: 0;
      transition: width 0.3s;
    }
    .nav-side:hover { color: rgba(255,255,255,0.9); }
    .nav-side:hover::before, .nav-side:hover::after { width: 40px; }

    .nav-badge {
      background: rgba(13,13,13,0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.5px;
      pointer-events: auto;
    }
    .nav-badge em {
      font-style: normal;
      color: var(--gold-light);
    }

    /* ── BOTTOM LABEL ── */
    .bottom-label {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .bottom-label::before, .bottom-label::after {
      content: '';
      display: block;
      width: 1px;
      height: 14px;
      background: rgba(255,255,255,0.25);
    }

    /* ── SPLIT CONTAINER ── */
    .split {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ── PANELS ── */
    .panel {
      position: relative;
      flex: 1;
      overflow: hidden;
      transition: flex 1.1s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .split:has(.panel-gelobel:hover) .panel-gelobel { flex: 1.12; }
    .split:has(.panel-gelobel:hover) .panel-belmar  { flex: 0.88; }
    .split:has(.panel-belmar:hover)  .panel-belmar  { flex: 1.12; }
    .split:has(.panel-belmar:hover)  .panel-gelobel { flex: 0.88; }

    /* divider line between panels */
    .panel-belmar::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.15);
      z-index: 10;
    }

    /* ── GELOBEL PANEL ── */
    .panel-gelobel {
      background: #0d0b07;
    }

    .gelobel-bg {
      position: absolute;
      inset: 0;
      background: url('./src/img-gelobel/picanha.jpg') center/cover no-repeat;
      transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .panel-gelobel:hover .gelobel-bg { transform: scale(1.015); }

    .gelobel-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.80) 0%,
        rgba(0,0,0,0.45) 50%,
        rgba(0,0,0,0.25) 100%
      );
    }

    .panel-gelobel .panel-content {
      position: absolute;
      bottom: 80px; left: 60px;
      z-index: 2;
    }

    .gelobel-wordmark {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(2.6rem, 5vw, 4rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
    }
    .gelobel-wordmark em {
      font-style: normal;
      color: var(--gold-light);
    }

    .panel-tagline {
      margin-top: 10px;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      font-weight: 400;
    }

    .btn-entrar-gold {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 36px;
      background: var(--gold-light);
      color: #0d0b07;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 16px 32px;
      border: none;
      cursor: pointer;
      transition: background 0.25s, gap 0.25s;
    }
    .btn-entrar-gold:hover {
      background: #ffc53d;
      gap: 16px;
    }
    .btn-entrar-gold .arrow { font-size: 16px; }

    /* ── BELMAR PANEL ── */
    .panel-belmar {
      position: relative;
    }

    .belmar-bg {
      position: absolute;
      inset: 0;
      background: url('./src/img-belmar/sashimi.jpg') center/cover no-repeat;
      transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .panel-belmar:hover .belmar-bg { transform: scale(1.015); }

    .belmar-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.72) 0%,
        rgba(0,0,0,0.28) 50%,
        rgba(0,0,0,0.15) 100%
      );
    }

    .panel-belmar .panel-content {
      position: absolute;
      bottom: 80px; left: 60px;
      z-index: 2;
    }

    .belmar-wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 5.5vw, 4.4rem);
      font-weight: 300;
      color: #fff;
      line-height: 1;
      letter-spacing: 2px;
    }

    .btn-entrar-outline {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 36px;
      background: transparent;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 15px 31px;
      border: 1.5px solid rgba(255,255,255,0.7);
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s, gap 0.25s;
    }
    .btn-entrar-outline:hover {
      background: rgba(255,255,255,0.1);
      border-color: #fff;
      gap: 16px;
    }
    .btn-entrar-outline .arrow { font-size: 16px; }

    /* ── MOBILE ── */
    @media (max-width: 640px) {
      html, body { overflow: hidden; }

      .split {
        flex-direction: column;
        height: 100vh;
      }

      .panel {
        flex: 1;
        height: auto;
        transition: flex 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* desativa hover no mobile */
      .split:has(.panel-gelobel:hover) .panel-gelobel,
      .split:has(.panel-gelobel:hover) .panel-belmar,
      .split:has(.panel-belmar:hover)  .panel-belmar,
      .split:has(.panel-belmar:hover)  .panel-gelobel { flex: 1; }

      /* toque ativo */
      .split.touch-gelobel .panel-gelobel { flex: 1.7; }
      .split.touch-gelobel .panel-belmar  { flex: 0.5; }
      .split.touch-belmar  .panel-belmar  { flex: 1.7; }
      .split.touch-belmar  .panel-gelobel { flex: 0.5; }

      .panel-belmar::before { left: 0; right: 0; top: 0; bottom: auto; width: auto; height: 1px; }

      .panel-gelobel .panel-content,
      .panel-belmar  .panel-content { left: 28px; bottom: 36px; }

      .nav { padding: 16px 20px; }
      .bottom-label { bottom: 14px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-badge">Grupo <em>Gelobel</em></div>
  </nav>

  <!-- SPLIT -->
  <div class="split">

    <!-- GELOBEL -->
    <a class="panel panel-gelobel" href="./index.html">
      <div class="gelobel-bg"></div>
      <div class="gelobel-overlay"></div>

      <div class="panel-content">
        <img src="https://gelobel.com.br/wp-content/uploads/2019/12/GELOBEL-AMARELO-E-BRANCO-2048x906.png" alt="Gelobel Logo" style="max-width:260px;display:block;margin-bottom:32px;">
        <span class="btn-entrar-gold">Entrar <span class="arrow">→</span></span>
      </div>
    </a>

    <!-- BELMAR -->
    <a class="panel panel-belmar" href="./src/html/belmar.html">
      <div class="belmar-bg"></div>
      <div class="belmar-overlay"></div>

      <div class="panel-content">
        <div class="belmar-wordmark">Belmar</div>
        <div class="panel-tagline" style="color:rgba(255,255,255,0.5)">Cozinha Japonesa &nbsp;·&nbsp; Desde 2025</div>
        <span class="btn-entrar-outline">Entrar <span class="arrow">→</span></span>
      </div>
    </a>

  </div>

  <!-- BOTTOM -->
  <div class="bottom-label">Um Grupo &nbsp;·&nbsp; Duas Mesas</div>

  <script>
    const split    = document.querySelector('.split');
    const gelobel  = document.querySelector('.panel-gelobel');
    const belmar   = document.querySelector('.panel-belmar');

    function isMobile() { return window.innerWidth <= 640; }

    gelobel.addEventListener('click', (e) => {
      if (!isMobile()) return;
      e.preventDefault();
      split.classList.remove('touch-belmar');
      split.classList.add('touch-gelobel');
      setTimeout(() => { window.location.href = gelobel.href; }, 750);
    });

    belmar.addEventListener('click', (e) => {
      if (!isMobile()) return;
      e.preventDefault();
      split.classList.remove('touch-gelobel');
      split.classList.add('touch-belmar');
      setTimeout(() => { window.location.href = belmar.href; }, 750);
    });

    // ao redimensionar, limpa estado
    window.addEventListener('resize', () => {
      if (!isMobile()) split.classList.remove('touch-gelobel', 'touch-belmar');
    });
  </script>

</body>
</html>
